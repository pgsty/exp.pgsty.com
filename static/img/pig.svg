<svg xmlns="http://www.w3.org/2000/svg"
     width="128" height="128" viewBox="0 0 128 128"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="pig-title pig-desc"
     shape-rendering="geometricPrecision">
  <title id="pig-title">PIG emblem</title>
  <desc id="pig-desc">A geometric pig head with two floppy ears and a round snout, framed by a rounded square.</desc>

  <defs>
    <linearGradient id="pig-skin" x1="24" y1="104" x2="104" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9647f"/>
      <stop offset="0.55" stop-color="#f191a6"/>
      <stop offset="1" stop-color="#fcccd7"/>
    </linearGradient>
    <linearGradient id="pig-snout" x1="46" y1="98" x2="82" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bc4a68"/>
      <stop offset="1" stop-color="#e2778f"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0b1119"/>
  <rect x="1.75" y="1.75" width="124.5" height="124.5" rx="26.25"
        fill="none" stroke="#3E668F" stroke-opacity="0.45" stroke-width="3.5"/>

  <g fill="url(#pig-skin)">
    <!-- Floppy ears: triangles fattened by a round-joined stroke, drawn under
         the head so the joins stay clean. -->
    <g stroke="url(#pig-skin)" stroke-width="7" stroke-linejoin="round">
      <path d="M 28 31 L 56 39 L 39 62 Z"/>
      <path d="M 100 31 L 72 39 L 89 62 Z"/>
    </g>
    <!-- Head: wider than tall, the way a pig reads at 16 px. -->
    <rect x="23" y="38" width="82" height="63" rx="29"/>
  </g>

  <!-- Eyes. -->
  <g fill="#0b1119">
    <circle cx="47" cy="61" r="4.6"/>
    <circle cx="81" cy="61" r="4.6"/>
  </g>

  <!-- Snout. -->
  <g>
    <rect x="45" y="72" width="38" height="24" rx="12" fill="url(#pig-snout)"/>
    <ellipse cx="56.5" cy="84" rx="3.7" ry="5.6" fill="#0b1119" fill-opacity="0.75"/>
    <ellipse cx="71.5" cy="84" rx="3.7" ry="5.6" fill="#0b1119" fill-opacity="0.75"/>
  </g>
</svg>
