<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="PG Exporter release archive banner">
  <title>PG Exporter release archive</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1018"/>
      <stop offset="0.48" stop-color="#101d2c"/>
      <stop offset="1" stop-color="#173047"/>
    </linearGradient>
    <radialGradient id="orb-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d92d4" stop-opacity="0.46"/>
      <stop offset="0.62" stop-color="#2b5c8c" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#2b5c8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-copper" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a35c" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#b4762e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b4762e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5da2dd" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#5da2dd" stop-opacity="0.8"/>
      <stop offset="0.84" stop-color="#5da2dd" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5da2dd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb8e8" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#7fb8e8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e0a35c" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#8fb4dc" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#ground)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Soft light wells, echoing the project's social card. -->
  <circle cx="1330" cy="180" r="430" fill="url(#orb-blue)"/>
  <circle cx="180" cy="820" r="380" fill="url(#orb-blue)"/>
  <circle cx="980" cy="880" r="330" fill="url(#orb-copper)"/>

  <!-- A release rail: one tick per version, the newest one lit. -->
  <path d="M120 660H1480" stroke="url(#rail)" stroke-width="2"/>
  <g fill="#5da2dd" fill-opacity="0.8">
    <circle cx="250" cy="660" r="4"/>
    <circle cx="400" cy="660" r="4"/>
    <circle cx="550" cy="660" r="4"/>
    <circle cx="700" cy="660" r="4"/>
    <circle cx="850" cy="660" r="4"/>
    <circle cx="1000" cy="660" r="4"/>
    <circle cx="1150" cy="660" r="4"/>
  </g>
  <circle cx="1300" cy="660" r="8" fill="#e0a35c" fill-opacity="0.85"/>
  <circle cx="1300" cy="660" r="18" fill="none" stroke="#e0a35c" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- A quiet metric trace above the rail. -->
  <path d="M120 560 L250 540 L400 566 L550 508 L700 534 L850 470 L1000 496 L1150 436 L1300 452 L1480 404"
        fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Wordmark for the social card. The hero crop and its fade mask put this
       band outside the visible area, so it never reads as a watermark there. -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="120" y="802" font-size="46" font-weight="700" letter-spacing="1.5" fill="#e8eef6">PG Exporter</text>
    <text x="123" y="840" font-size="21" font-weight="500" letter-spacing="2.6" fill="#7fb8e8" font-family="'SFMono-Regular','Cascadia Code','Roboto Mono',Menlo,Consolas,monospace">RELEASE NOTES · exp.pgsty.com</text>
  </g>
</svg>
