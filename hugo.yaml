#=======================================#
# Basics
#=======================================#
baseURL: https://exp.pgsty.com/
title: PG Exporter
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true
capitalizeListTitles: false

pagination:
  pagerSize: 60

#=======================================#
# OINK theme module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
  mounts:
    # English sources and colocated .zh.md translations.
    - source: content
      target: content
      sites:
        matrix:
          languages: [en, zh]

#=======================================#
# Languages and navigation
#=======================================#
# Manuals intentionally live at the site root. /docs/ remains the overview.
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: PG Exporter
    params:
      description: "PG Exporter: a declarative, extensible PostgreSQL and PgBouncer metrics exporter for Prometheus."
      time_format_blog: 'January 02, 2006'
    menu:
      main:
        - identifier: docs
          name: Docs
          weight: 10
          url: /docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: Blog
          weight: 20
          url: /blog/
          pre: <i class='fa-solid fa-blog'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: PG Exporter
    params:
      description: "PG Exporter：面向 Prometheus、声明式且可扩展的 PostgreSQL 与 PgBouncer 指标导出器。"
      time_format_blog: '2006年01月02日'
      copyright:
        authors: '[PG Exporter Contributors](https://github.com/pgsty/pg_exporter) · 文档采用 [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) 许可'
        from_year: 2018
    menu:
      main:
        - identifier: docs
          name: 文档
          weight: 10
          url: /zh/docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: 博客
          weight: 20
          url: /zh/blog/
          pre: <i class='fa-solid fa-blog'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  categories: categories
  tags: tags

# Blog sources stay below content/blog, while public URLs omit /blog/.
permalinks:
  page:
    blog: '/:sections[1:]/:contentbasename/'
  section:
    blog: '/:sections[1:]/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

# OINK supplies Markdown/LLMS/print support. JSON remains enabled for the
# preserved landing-page search dialog.
outputs:
  home: [HTML, RSS, JSON, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: "PG Exporter turns declarative SQL collectors into Prometheus metrics for PostgreSQL and PgBouncer, with dynamic planning across server versions and roles."
  images:
    - img/pg-exporter-social-card.png
  logo: img/pg-exporter.png
  version: 1.4.1
  metric_families: 600
  collector_files: 58
  tagged_versions: 35
  copyright:
    authors: '[PG Exporter Contributors](https://github.com/pgsty/pg_exporter) · Documentation licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
    from_year: 2018
  content_license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/

  page_width: normal
  footer_icp: ""
  footer_icp_url: https://beian.miit.gov.cn/

  archived_version: false
  url_latest_version: https://exp.pgsty.com
  github_repo: ""
  github_project_repo: https://github.com/pgsty/pg_exporter
  github_branch: main

  # OINK owns documentation search and generates one local index per language.
  # The landing page keeps its existing branded dialog as a page-only override.
  offlineSearch: true
  offlineSearchIndex: content
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false

  ui:
    quick_links: [docs, blog]
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    ul_show: 2
    showLightDarkModeMenu: true
    page_context_menu:
      enable: true
      links: []
    feedback:
      enable: false
    readingtime:
      enable: false
    scrollSpy:
      disable: true

  links:
    user:
      - name: PG Exporter source
        url: https://github.com/pgsty/pg_exporter
        icon: fa-brands fa-github
        desc: pg_exporter source repository
      - name: Pigsty
        url: https://pigsty.io
        icon: fa-solid fa-database
        desc: Pigsty project
    developer:
      - name: Releases
        url: https://github.com/pgsty/pg_exporter/releases
        icon: fa-solid fa-box-archive
        desc: PG Exporter release artifacts
      - name: Discussions
        url: https://github.com/pgsty/pg_exporter/discussions
        icon: fa-solid fa-comments
        desc: PG Exporter community discussions
