#=======================================#
# Basics
#=======================================#
baseURL: https://exp.pgsty.com/
title: PG Exporter
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true
capitalizeListTitles: false

pagination:
  pagerSize: 60

services:
  googleAnalytics:
    id: G-Y7HMTRQ6P7

#=======================================#
# OINK theme module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink
  mounts:
    # English sources and colocated .zh.md translations.
    - source: content
      target: content
      sites:
        matrix:
          languages: [en, zh]

#=======================================#
# Languages and navigation
#=======================================#
# Manuals intentionally live at the site root. /docs/ remains the overview.
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: PG Exporter
    params:
      description: "PG Exporter: a declarative, extensible PostgreSQL and PgBouncer metrics exporter for Prometheus."
      ui:
        command_palette:
          commands:
            - id: latest_release
              title: Latest PG Exporter release
              description: Open the newest stable release and its verified artifacts
              url: https://github.com/pgsty/pg_exporter/releases/latest
              icon: fa-solid fa-box-archive
              keywords: [release, download, rpm, deb, archive, checksum]
    menu:
      main:
        - identifier: download
          name: Download
          weight: 30
          pageRef: /download
          pre: <i class='fa-solid fa-download'></i>
        - identifier: docs
          name: Docs
          weight: 10
          pageRef: /docs
          pre: <i class='fa-solid fa-book'></i>
        - identifier: docs-start
          parent: docs
          name: Quick Start
          weight: 10
          pageRef: /start
          params:
            icon: fa-solid fa-rocket
            description: Export the first PostgreSQL metrics in five minutes
        - identifier: docs-deploy
          parent: docs
          name: Deployment
          weight: 20
          pageRef: /deploy
          params:
            icon: fa-solid fa-server
            description: Run securely with systemd, containers, and Prometheus
        - identifier: docs-config
          parent: docs
          name: Collector Configuration
          weight: 30
          pageRef: /config
          params:
            icon: fa-solid fa-code
            description: Define version-aware metrics with YAML and SQL
        - identifier: docs-api
          parent: docs
          name: HTTP API
          weight: 40
          pageRef: /api
          params:
            icon: fa-solid fa-plug
            description: Metrics, health, planning, statistics, and reload endpoints
        - identifier: blog
          name: Blog
          weight: 20
          pageRef: /blog
          pre: <i class='fa-solid fa-blog'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: PG Exporter
    params:
      description: "PG Exporter：面向 Prometheus、声明式且可扩展的 PostgreSQL 与 PgBouncer 指标导出器。"
      copyright:
        authors: '[PG Exporter Contributors](https://github.com/pgsty/pg_exporter) · 文档采用 [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) 许可'
        from_year: 2018
      ui:
        command_palette:
          commands:
            - id: latest_release
              title: 最新 PG Exporter 版本
              description: 打开最新稳定版本及其可校验的发布产物
              url: https://github.com/pgsty/pg_exporter/releases/latest
              icon: fa-solid fa-box-archive
              keywords: [发布, 下载, RPM, DEB, 压缩包, 校验和]
    menu:
      main:
        - identifier: download
          name: 下载
          weight: 30
          pageRef: /download
          pre: <i class='fa-solid fa-download'></i>
        - identifier: docs
          name: 文档
          weight: 10
          pageRef: /docs
          pre: <i class='fa-solid fa-book'></i>
        - identifier: docs-start
          parent: docs
          name: 快速上手
          weight: 10
          pageRef: /start
          params:
            icon: fa-solid fa-rocket
            description: 用五分钟导出第一组 PostgreSQL 指标
        - identifier: docs-deploy
          parent: docs
          name: 生产部署
          weight: 20
          pageRef: /deploy
          params:
            icon: fa-solid fa-server
            description: 使用 systemd、容器与 Prometheus 安全运行
        - identifier: docs-config
          parent: docs
          name: 采集器配置
          weight: 30
          pageRef: /config
          params:
            icon: fa-solid fa-code
            description: 使用 YAML 与 SQL 定义版本感知的指标
        - identifier: docs-api
          parent: docs
          name: HTTP API
          weight: 40
          pageRef: /api
          params:
            icon: fa-solid fa-plug
            description: 指标、健康、规划、统计与重载端点
        - identifier: blog
          name: 博客
          weight: 20
          pageRef: /blog
          pre: <i class='fa-solid fa-blog'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  categories: categories
  tags: tags
  # Declaring the author taxonomy is the whole switch: OINK turns the blog
  # article head into portraits and linked names, makes each term page an
  # author profile, and emits one <dc:creator> per author in the feed.
  author: authors

# Blog sources stay below content/blog, while public URLs omit /blog/.
permalinks:
  page:
    blog: '/:sections[1:]/:contentbasename/'
  section:
    blog: '/:sections[1:]/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

# OINK supplies Markdown/LLMS/print support and the shared offline search.
outputs:
  home: [HTML, RSS, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: "PG Exporter turns declarative SQL collectors into Prometheus metrics for PostgreSQL and PgBouncer, with dynamic planning across server versions and roles."
  images:
    - img/pg-exporter-social-card.png
  logo: img/pg-exporter.png
  version: 1.4.1
  metric_families: 600
  collector_files: 58
  tagged_versions: 35
  copyright:
    authors: '[PG Exporter Contributors](https://github.com/pgsty/pg_exporter) · Documentation licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)'
    from_year: 2018
  content_license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/

  # Page comments through GitHub Discussions on this documentation repository.
  # The Announcements category only accepts discussions created by the giscus
  # app, so a thread exists for a page once someone comments on it. Reading a
  # page loads nothing from giscus.app: the frame is lazy and only pages that
  # render a page end -- documentation, blog, and section indexes, never the
  # landing pages -- carry it at all. Front matter `comments: false` opts a
  # page out.
  comments:
    enable: true
    type: giscus
    giscus:
      repo: pgsty/exp.pgsty.com
      repoId: R_kgDOTzFgEA
      category: Announcements
      categoryId: DIC_kwDOTzFgEM4DD37v
      # One discussion per page path, so an English page and its Chinese peer
      # keep separate threads.
      mapping: pathname
      reactionsEnabled: 1
      inputPosition: top
      loading: lazy

  page_width: normal
  footer_icp: ""
  footer_icp_url: https://beian.miit.gov.cn/

  archived_version: false
  url_latest_version: https://exp.pgsty.com
  github_repo: https://github.com/pgsty/exp.pgsty.com
  github_project_repo: https://github.com/pgsty/pg_exporter
  github_branch: main

  # OINK owns search everywhere and generates one local index per language.
  offline_search: true
  offline_search_index: content
  offline_search_max_results: 10

  ui:
    blog_index_size: 60
    # Let a reader cycle a blog index through rows, cards, and the compact
    # table. The release archive publishes the table form; the toggle keeps the
    # other two reachable without leaving the page.
    blog_index_toggle: true
    typography: system
    quick_links: [docs, blog, download]
    sidebar_icon_policy: groups
    breadcrumb: true
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    sidebar_expand_levels: 2
    dark_mode:
      show_menu: true
    page_context_menu:
      enable: true
      assistant_links: true
      links: []
    feedback:
      enable: false
    reading_time: false
    scroll_spy: false
