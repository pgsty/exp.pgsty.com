#=======================================#
# Basics
#=======================================#
baseURL: https://exp.pgsty.com/
title: PG Exporter - PostgreSQL Observability
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true
# 标签等列表页标题保留作者原始大小写（不要把 pg_duckdb 渲染成 Pg_duckdb）。
capitalizeListTitles: false

# 列表页每页条目数（博客列表、标签页等）。放宽到 60，让 /release/ 的全部版本
# 在一页里列完，不必翻页。
pagination:
  pagerSize: 60

#=======================================#
# Hugo Module
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.155.0"
  imports:
    - path: github.com/google/docsy
      disable: false

#=======================================#
# Languages and navigation
#=======================================#
# 文档正文直接挂在站点根下（/install/、/config/、/api/……），不带 /docs/ 前缀；
# /docs/ 只是文档总览页。
languages:
  en:
    label: English
    locale: en
    weight: 1
    title: PG Exporter
    params:
      description: "PG Exporter: a declarative, extensible PostgreSQL and PgBouncer metrics exporter for Prometheus."
      time_format_blog: 'January 02, 2006'
    menu:
      main:
        - identifier: docs
          name: Docs
          weight: 10
          url: /docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: Blog
          weight: 20
          url: /blog/
          pre: <i class='fa-solid fa-blog'></i>
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: PG Exporter
    params:
      description: "PG Exporter：面向 Prometheus、声明式且可扩展的 PostgreSQL 与 PgBouncer 指标导出器。"
      time_format_blog: '2006年01月02日'
    menu:
      main:
        - identifier: docs
          name: 文档
          weight: 10
          url: /zh/docs/
          pre: <i class='fa-solid fa-book'></i>
        - identifier: blog
          name: 博客
          weight: 20
          url: /zh/blog/
          pre: <i class='fa-solid fa-blog'></i>

#=======================================#
# Taxonomies and blog URLs
#=======================================#
taxonomies:
  categories: categories
  tags: tags

# 博客内容按栏目组织在 content/blog/ 下，但 URL 不带 blog 前缀：
# content/blog/release/v1.4.1.md → /release/v1.4.1/
# content/blog/release/_index.md    → /release/
# :sections[1:] 丢掉第一段（blog），新开的博客栏目自动照此规则。
# content/blog/_index.md 自身会算出 "/"，所以它在 front matter 里显式写死 url。
permalinks:
  page:
    blog: '/:sections[1:]/:contentbasename/'
  section:
    blog: '/:sections[1:]/'

#=======================================#
# Markdown and syntax highlighting
#=======================================#
markup:
  goldmark:
    parser:
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['\(', '\)']
          block:
            - ['$$', '$$']
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

#=======================================#
# Outputs
#=======================================#
outputs:
  home: [HTML, RSS, JSON]
  page: [HTML]
  section: [HTML, RSS]

#=======================================#
# Services
#=======================================#
# 尚未为 exp.pgsty.com 配置独立统计数据流；不要复用复制来源站点的 ID。

#=======================================#
# Site parameters
#=======================================#
params:
  description: "PG Exporter turns declarative SQL collectors into Prometheus metrics for PostgreSQL and PgBouncer, with dynamic planning across server versions and roles."
  images:
    - img/pg-exporter-social-card.png
  version: 1.4.1            # 最新稳定版，正文用 {{< param version >}}
  metric_families: 600      # 默认配置暴露的指标族数量（约数）
  collector_files: 58       # config/ 中的采集器定义文件数量
  tagged_versions: 35       # Git 标签数量，release note 一标签一篇
  copyright:
    authors: PG Exporter Contributors
    from_year: 2018
    url: https://github.com/pgsty/pg_exporter

  # 正文列宽模式：normal（1050px，默认）| wide（1300px）| full（占满可用宽）。
  # 页面 front matter 可单页覆盖（page_width: wide），栏目可经 cascade 继承。
  page_width: normal
  # ICP 备案号（单行页脚居中显示，链接到 beian.miit.gov.cn；留空则不渲染）。
  footer_icp: ""

  archived_version: false
  url_latest_version: https://exp.pgsty.com
  github_repo: ""
  github_project_repo: https://github.com/pgsty/pg_exporter
  github_branch: main

  # 站内搜索由项目自有的 ⌘K 弹窗实现（lunr 自托管 + 按语言索引），
  # 必须关闭 Docsy offlineSearch：否则其 offline-search.js 在页面上找不到
  # .td-search input 时会 $.ajax(undefined) 抓当前页 HTML 并抛错。
  offlineSearch: false
  prism_syntax_highlighting: false

  ui:
    breadcrumb_disable: false
    navbar_logo: true
    navbar_translucent_over_cover_disable: false
    navbar_theme: dark
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 2000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    ul_show: 2
    showLightDarkModeMenu: true
    # TOC 高亮由 pig-docs.js 的 IntersectionObserver 实现；Docsy 的
    # Bootstrap ScrollSpy 注入路径存在属性转义 bug，本就从未生效。
    scrollSpy:
      disable: true
    # ---- Fumadocs 式侧栏定制（chrome）----
    # 搜索框下方的根节点下拉：列出 /docs/ 总览 + 所有 sidebar_root_for: self
    # 的 section（这里就是 Blog）。
    sidebar_root_menu: true
    # 侧栏宽度（px）：默认宽随断点 268/286，可拖拽调整并持久化；
    # min/max 为拖拽钳制范围，可在栏目 front matter 中经 cascade 覆盖。
    sidebar_width_min: 220
    sidebar_width_max: 480
    # 侧栏条目文字溢出策略：ellipsis（省略号，默认）| wrap（换行）。
    sidebar_item_overflow: ellipsis
    feedback:
      enable: false
    readingtime:
      enable: false

  links:
    user:
      - name: PG Exporter source
        url: https://github.com/pgsty/pg_exporter
        icon: fab fa-github
        desc: pg_exporter source repository
      - name: Pigsty
        url: https://pigsty.io
        icon: fa fa-database
        desc: Pigsty project
    developer:
      - name: Releases
        url: https://github.com/pgsty/pg_exporter/releases
        icon: fa fa-box-archive
        desc: PG Exporter release artifacts
      - name: Discussions
        url: https://github.com/pgsty/pg_exporter/discussions
        icon: fa fa-comments
        desc: PG Exporter community discussions
