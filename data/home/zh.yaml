# OINK 按这里的顺序组装首页。下列产品数字与 data/home/metrics.yaml
# 保持一致；后者记录了各项数字的来源约束。
sections:
  - hero
  - metrics
  - capabilities
  - type: cards
    key: delivery
    id: download
  - cta

hero:
  eyebrow: PostgreSQL + PgBouncer → Prometheus
  title: PG Exporter
  desc: '将 PostgreSQL 与 PgBouncer 指标导出到 Prometheus。用 YAML 和 SQL 定义采集器，PG Exporter 根据目标版本、角色与已安装的扩展选择查询。'
  note: v1.6.0 · 460 指标定义 · PostgreSQL 与 PgBouncer
  actions:
    - label: 下载安装
      url: download/
      icon: fa-solid fa-download
      style: primary
    - label: 浏览文档
      url: docs/
      icon: fa-solid fa-book-open
      style: ghost
  image:
    light: img/architecture-zh-light.svg
    dark: img/architecture-zh-dark.svg
    alt: 'PG Exporter v1.6.0：每个进程采集一个 PostgreSQL 实例或 PgBouncer 目标，通过 /metrics 供 Prometheus 或 VictoriaMetrics 抓取'
  media:
    ratio: 1fr 0.94fr
    max_width: 500px
    hide_below: md

metrics:
  eyebrow: 稳定版本
  title: 从内置采集器开始
  desc: 内置 SQL 查询覆盖活动会话、复制、WAL、锁、数据库对象及部分扩展。
  columns: 3
  link_label: 查看详情
  items:
    - value: 460
      label: 指标定义
      desc: 由内置 SQL 采集器定义
      icon: fa-solid fa-chart-line
      url: collectors/
    - value: 58
      label: 采集器文件
      desc: YAML 文件，含配置模型参考
      icon: fa-solid fa-file-code
      url: collectors/
    - value: 10–19
      label: PostgreSQL
      desc: 默认配置包含的版本分支
      icon: fa-solid fa-database
      url: compatibility/

capabilities:
  eyebrow: 为什么选择 PG Exporter
  title: 定义需要采集的指标
  desc: 编写 SQL 并描述结果列，PG Exporter 负责执行查询，将结果转换为 Prometheus 指标。
  items:
    - ref: 01 / 声明
      title: 用 YAML + SQL 定义指标
      url: config/
      motto: 无需重新编译即可添加指标
      bullets:
        - 将查询列明确映射为 GAUGE、COUNTER、HISTOGRAM 与 LABEL。
        - 为每个采集器单独设置缓存 TTL 与查询超时。
        - 从同一个配置目录加载内置与自定义采集器。
      visual:
        type: code
        title: collector.yml
        aria_label: PG Exporter 声明式采集器示例
        lines:
          - { class: v, text: 'pg_example:' }
          - { class: k, prefix: '  query: ', text: 'SELECT count(*) AS count FROM pg_stat_activity' }
          - { class: k, text: '  metrics:' }
          - { class: k, text: '    - count:' }
          - { class: k, text: '        usage: GAUGE' }
          - { class: k, text: '        description: Number of connections' }
    - ref: 02 / 规划
      title: 为每个目标选择正确查询
      url: intro/
      motto: 按目标条件选择查询
      bullets:
        - 根据版本、主备角色与标签选择采集器。
        - 服务器版本有差异时，为采集器编写不同查询分支。
        - 通过 `/explain` 查看已选中的采集器。
      visual:
        type: code
        title: 查询选择规则
        aria_label: 采集器选择规则示意
        lines:
          - { class: c, text: '版本：min_version ≤ v < max_version' }
          - { class: c, text: '标签：主备角色与自定义标签' }
          - { class: c, text: '谓词：SQL 返回 true' }
          - { class: c, text: '/explain：已选中的查询' }
    - ref: 03 / 运维
      title: 检查导出器的运行状态
      url: api/
      motto: 检查采集结果与目标健康状态
      bullets:
        - 通过 `/stat` 检查查询耗时、报错次数与缓存命中次数。
        - 无需重启进程即可重载采集器配置。
        - 用健康检查与主备角色端点配置探针。
      visual:
        type: components
        columns: 2
        compact: true
        aria_label: PG Exporter HTTP 端点
        items:
          - { icon: fa-solid fa-chart-line, title: /metrics, detail: 抓取输出, url: api/#get-metrics }
          - { icon: fa-solid fa-heart-pulse, title: /up, detail: 目标健康, url: api/#get-up }
          - { icon: fa-solid fa-route, title: /primary · /replica, detail: 角色路由, url: api/#流量路由 }
          - { icon: fa-solid fa-magnifying-glass, title: /explain, detail: 已选查询, url: api/#get-explain }
          - { icon: fa-solid fa-gauge-high, title: /stat, detail: 查询统计, url: api/#get-stat }
          - { icon: fa-solid fa-rotate, title: /reload, detail: 热重载, url: api/#get-reload--post-reload }


delivery:
  eyebrow: 下载与部署
  title: 选择安装方式
  desc: 软件包附带 systemd 服务；压缩包和容器由你管理进程；Pigsty 负责配置监控栈。
  columns: 4
  link_label: 比较安装方式
  items:
    - name: Linux 软件包
      icon: fa-solid fa-box-archive
      meta: 长期服务首选
      desc: 通过 APT 或 YUM 安装，软件包附带 systemd 服务与配置。
      url: download/
    - name: 发布压缩包
      icon: fa-solid fa-file-zipper
      meta: Linux · macOS · Windows
      desc: 下载适合操作系统的程序与采集器配置。
      url: download/
    - name: 容器镜像
      icon: fa-brands fa-docker
      meta: amd64 · arm64
      desc: 通过 Docker 或 Kubernetes 运行 `pgsty/pg_exporter`。
      url: download/
    - name: Pigsty 或源码
      icon: fa-solid fa-code-branch
      meta: 完整集成或完全自定义
      desc: 用 Pigsty 部署监控栈，或从源码构建 PG Exporter。
      url: download/

cta:
  title: 采集第一组指标
  desc: 按快速上手安装 PG Exporter，并连接 PostgreSQL。
  actions:
    - label: 下载 PG Exporter
      url: download/
      icon: fa-solid fa-download
      style: primary
    - label: 快速上手
      url: start/
      icon: fa-solid fa-rocket
      style: ghost
