# OINK composes the homepage in this exact order. Product facts shown here are
# mirrored in data/home/metrics.yaml, where their source contract is recorded.
sections:
  - hero
  - metrics
  - capabilities
  - principles
  - type: cards
    key: delivery
    id: download
  - cta

hero:
  eyebrow: PostgreSQL + PgBouncer → Prometheus
  title: PG Exporter
  desc: '**PostgreSQL observability, expressed in SQL.** Define metrics in YAML and SQL; let one exporter select the right collector for each target version, role, and extension set.'
  note: 600+ metrics · PostgreSQL 10–19+ · PgBouncer 1.8–1.25+
  actions:
    - label: Download
      url: download/
      icon: fa-solid fa-download
      style: primary
    - label: Read the docs
      url: docs/
      icon: fa-solid fa-book-open
      style: ghost
  image:
    light: img/architecture-light.svg
    dark: img/architecture-dark.svg
    alt: 'PG Exporter architecture: PostgreSQL, PgBouncer, Patroni, and pgBackRest collected by one PG Exporter process that serves merged metrics on :9630/metrics to Prometheus and VictoriaMetrics'
  media:
    ratio: minmax(0, 1fr) minmax(340px, 0.94fr)
    max_width: 500px
    hide_below: md

metrics:
  eyebrow: Shipped surface
  title: Useful defaults, backed by inspectable definitions
  desc: Product coverage rather than adoption counters; every number maps to the current source tree or release archive.
  columns: 4
  link_label: Inspect
  items:
    - value: 600+
      label: Metrics
      desc: in the merged default config
      icon: fa-solid fa-chart-line
      url: collectors/
    - value: 58
      label: Collector files
      desc: versioned YAML + SQL definitions
      icon: fa-solid fa-file-code
      url: collectors/
    - value: 10–19+
      label: PostgreSQL
      desc: covered by the default bundle
      icon: fa-solid fa-database
      url: compatibility/
    - value: 35
      label: Documented tags
      desc: v0.0.1 through v1.4.1
      icon: fa-solid fa-clock-rotate-left
      url: release/

capabilities:
  eyebrow: Why PG Exporter
  title: Metric logic database engineers can read
  desc: Collector behavior is data. The runtime owns discovery, planning, caching, failure isolation, and encoding.
  items:
    - ref: 01 / DECLARE
      title: Define metrics in YAML + SQL
      url: config/
      motto: Change the collector, not the binary
      bullets:
        - Map columns to GAUGE, COUNTER, HISTOGRAM, and LABEL.
        - Set TTL, timeout, skip, and fatal behavior per collector.
        - Keep custom collectors beside the shipped ones.
      value: The metric contract stays readable to the database team.
      visual:
        type: code
        title: collector.yml
        aria_label: Declarative PG Exporter collector example
        lines:
          - { class: v, text: 'pg_example:' }
          - { class: k, prefix: '  query: ', text: 'SELECT value FROM view' }
          - { class: k, prefix: '  min_version: ', text: '100000' }
          - { class: k, prefix: '  tags: ', text: '[cluster, primary]' }
          - { class: k, prefix: '  ttl: ', text: '10' }
          - { class: k, prefix: '  timeout: ', text: '0.1' }
    - ref: 02 / PLAN
      title: The right query per target
      url: intro/
      motto: One binary, target-aware execution
      bullets:
        - Match version, recovery role, database, user, and extensions.
        - Branch a collector instead of freezing it at the oldest version.
        - Ask `/explain` why a branch was chosen or skipped.
      value: Compatibility is decided at runtime, not in release notes.
      visual:
        type: code
        title: GET /explain
        aria_label: PG Exporter dynamic planning result
        lines:
          - { class: ok, prefix: '✓ ', text: 'pg_wal / primary / PG17' }
          - { class: ok, prefix: '✓ ', text: 'pg_stat_statements / 1.11' }
          - { class: c, prefix: '– ', text: 'pg_replica / role mismatch' }
          - { class: c, prefix: '– ', text: 'pgbouncer / target mismatch' }
    - ref: 03 / OPERATE
      title: Observe the exporter itself
      url: api/
      motto: Scrapes are only one part of the runtime
      bullets:
        - See duration, errors, and cache state in `/stat`.
        - Reload configuration without restarting the process.
        - Use health and primary/replica endpoints for probes.
      value: The exporter exposes the evidence needed to operate it.
      visual:
        type: components
        columns: 2
        compact: true
        aria_label: PG Exporter HTTP endpoints
        items:
          - { icon: fa-solid fa-chart-line, title: /metrics, detail: Scrape output, url: api/#get-metrics }
          - { icon: fa-solid fa-heart-pulse, title: /up, detail: Target health, url: api/#get-up }
          - { icon: fa-solid fa-route, title: /primary · /replica, detail: Role routing, url: api/#traffic-routing }
          - { icon: fa-solid fa-magnifying-glass, title: /explain, detail: Planning verdicts, url: api/#get-explain }
          - { icon: fa-solid fa-gauge-high, title: /stat, detail: Runtime evidence, url: api/#get-stat }
          - { icon: fa-solid fa-rotate, title: /reload, detail: Hot reload, url: api/#get-reload--post-reload }

principles:
  eyebrow: Production fit
  title: A small binary with clear operational boundaries
  columns: 3
  items:
    - icon: fa-solid fa-battery-full
      title: Batteries included
      desc: Start with broad PostgreSQL and PgBouncer coverage, then replace only the definitions you need to own.
    - icon: fa-solid fa-sliders
      title: Precise control
      desc: Version gates, predicates, timeouts, cache TTLs, failure policy, and constant labels are all explicit.
    - icon: fa-solid fa-boxes-stacked
      title: Deploy your way
      desc: Use RPM/DEB packages, release archives, containers, Pigsty automation, or a source build.

delivery:
  eyebrow: Download and deploy
  title: Choose the path that matches your environment
  desc: Every route runs the same PG Exporter binary and declarative collector model. The difference is lifecycle ownership.
  columns: 4
  link_label: Compare methods
  items:
    - name: Linux packages
      icon: fa-solid fa-box-archive
      meta: Recommended for services
      desc: Install `pg-exporter` from the Pigsty APT/YUM repository or a versioned RPM/DEB; get systemd integration and `/etc/default/pg_exporter`.
      url: download/
    - name: Release archives
      icon: fa-solid fa-file-zipper
      meta: Linux · macOS · Windows
      desc: Download a pinned binary, merged config, service examples, license, and checksums from the GitHub release.
      url: download/
    - name: Container image
      icon: fa-brands fa-docker
      meta: amd64 · arm64
      desc: Run the multi-architecture `pgsty/pg_exporter` image and mount only the configuration or CA material you need.
      url: download/
    - name: Pigsty or source
      icon: fa-solid fa-code-branch
      meta: Integrated or custom
      desc: Let Pigsty deliver the complete monitoring stack, or build the tagged source with its declared Go toolchain.
      url: download/

cta:
  title: Go from download to `pg_up 1`.
  desc: Pick an artifact, configure one connection URL, then verify the exporter before adding the Prometheus scrape.
  actions:
    - label: Download PG Exporter
      url: download/
      icon: fa-solid fa-download
      style: primary
    - label: Five-minute quick start
      url: start/
      icon: fa-solid fa-rocket
      style: ghost
