# OINK composes the homepage in this exact order. Product facts shown here are
# mirrored in data/home/metrics.yaml, where their source contract is recorded.
sections:
  - hero
  - metrics
  - capabilities
  - type: cards
    key: delivery
    id: download
  - cta

hero:
  eyebrow: PostgreSQL + PgBouncer → Prometheus
  title: PG Exporter
  desc: 'Export PostgreSQL and PgBouncer metrics to Prometheus. Define collectors in YAML and SQL. PG Exporter selects queries for the target version, role, and installed extensions.'
  note: v1.6.0 · 460 metric definitions · PostgreSQL and PgBouncer
  actions:
    - label: Download
      url: download/
      icon: fa-solid fa-download
      style: primary
    - label: Read the docs
      url: docs/
      icon: fa-solid fa-book-open
      style: ghost
  image:
    light: img/architecture-light.svg
    dark: img/architecture-dark.svg
    alt: 'PG Exporter v1.6.0: each process collects one PostgreSQL instance or PgBouncer target and serves metrics to Prometheus or VictoriaMetrics'
  media:
    ratio: 1fr 0.94fr
    max_width: 500px
    hide_below: md

metrics:
  eyebrow: Stable release
  title: Start with the bundled collectors
  desc: The bundled SQL queries cover activity, replication, WAL, locks, database objects, and selected extensions.
  columns: 3
  link_label: Inspect
  items:
    - value: 460
      label: Metric definitions
      desc: across the bundled SQL collectors
      icon: fa-solid fa-chart-line
      url: collectors/
    - value: 58
      label: Collector files
      desc: YAML files, including the schema reference
      icon: fa-solid fa-file-code
      url: collectors/
    - value: 10–19
      label: PostgreSQL
      desc: collector branches in the default bundle
      icon: fa-solid fa-database
      url: compatibility/

capabilities:
  eyebrow: Why PG Exporter
  title: Define what to collect
  desc: Write the SQL and describe its result columns. PG Exporter runs the queries and converts their results to Prometheus metrics.
  items:
    - ref: 01 / DECLARE
      title: Define metrics in YAML + SQL
      url: config/
      motto: Add metrics without rebuilding
      bullets:
        - Map columns to GAUGE, COUNTER, HISTOGRAM, and LABEL.
        - Set a cache TTL and query timeout for each collector.
        - Load bundled and custom collectors from one directory.
      visual:
        type: code
        title: collector.yml
        aria_label: Declarative PG Exporter collector example
        lines:
          - { class: v, text: 'pg_example:' }
          - { class: k, prefix: '  query: ', text: 'SELECT count(*) AS count FROM pg_stat_activity' }
          - { class: k, text: '  metrics:' }
          - { class: k, text: '    - count:' }
          - { class: k, text: '        usage: GAUGE' }
          - { class: k, text: '        description: Number of connections' }
    - ref: 02 / PLAN
      title: The right query per target
      url: intro/
      motto: Select queries for each target
      bullets:
        - Select collectors by version, role, and tags.
        - Use separate query branches when server versions differ.
        - Use `/explain` to inspect the selected collectors.
      visual:
        type: code
        title: Selection rules
        aria_label: Collector selection rules, shown as an illustration
        lines:
          - { class: c, text: 'version: min_version ≤ v < max_version' }
          - { class: c, text: 'tags: role and operator tags' }
          - { class: c, text: 'predicate: SQL returns true' }
          - { class: c, text: '/explain: selected queries' }
    - ref: 03 / OPERATE
      title: Observe the exporter itself
      url: api/
      motto: Check collection and target health
      bullets:
        - See query duration, error counts, and cache hits in `/stat`.
        - Reload configuration without restarting the process.
        - Use health and primary/replica endpoints for probes.
      visual:
        type: components
        columns: 2
        compact: true
        aria_label: PG Exporter HTTP endpoints
        items:
          - { icon: fa-solid fa-chart-line, title: /metrics, detail: Scrape output, url: api/#get-metrics }
          - { icon: fa-solid fa-heart-pulse, title: /up, detail: Target health, url: api/#get-up }
          - { icon: fa-solid fa-route, title: /primary · /replica, detail: Role routing, url: api/#traffic-routing }
          - { icon: fa-solid fa-magnifying-glass, title: /explain, detail: Selected queries, url: api/#get-explain }
          - { icon: fa-solid fa-gauge-high, title: /stat, detail: Query statistics, url: api/#get-stat }
          - { icon: fa-solid fa-rotate, title: /reload, detail: Hot reload, url: api/#get-reload--post-reload }


delivery:
  eyebrow: Download and deploy
  title: Choose an installation method
  desc: Packages include a systemd service. Archives and containers let you manage the process yourself. Pigsty configures the monitoring stack.
  columns: 4
  link_label: Compare methods
  items:
    - name: Linux packages
      icon: fa-solid fa-box-archive
      meta: Recommended for services
      desc: Install with APT or YUM. The package includes a systemd service and its configuration.
      url: download/
    - name: Release archives
      icon: fa-solid fa-file-zipper
      meta: Linux · macOS · Windows
      desc: Download the binary and collector configuration for your operating system.
      url: download/
    - name: Container image
      icon: fa-brands fa-docker
      meta: amd64 · arm64
      desc: Run `pgsty/pg_exporter` with Docker or Kubernetes.
      url: download/
    - name: Pigsty or source
      icon: fa-solid fa-code-branch
      meta: Integrated or custom
      desc: Deploy a monitoring stack with Pigsty, or build PG Exporter from source.
      url: download/

cta:
  title: Collect your first metrics
  desc: Follow the quick start to install PG Exporter and connect it to PostgreSQL.
  actions:
    - label: Download PG Exporter
      url: download/
      icon: fa-solid fa-download
      style: primary
    - label: Quick start
      url: start/
      icon: fa-solid fa-rocket
      style: ghost
