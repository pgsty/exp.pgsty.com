# PG Exporter install channels, consumed by the download landing section and by
# the `download` shortcode. `version` is deliberately absent so the record
# follows params.version in hugo.yaml, and `tag` defaults to v{version}.
#
# Only pinned channels interpolate ${version} and ${tag}; the rolling repository
# and Pigsty channels stay bound to a moving target on purpose.
repo: pgsty/pg_exporter
published: true
channels:
  - id: packages
    kind: rolling
    title: Linux packages
    title_zh: Linux 软件包
    icon: fa-solid fa-box-archive
    note: >-
      For Linux services. The package includes the binary, collector configuration,
      systemd unit, and `/etc/default/pg_exporter`. Use APT or YUM for upgrades.
    note_zh: >-
      适合 Linux 服务。软件包包含程序、采集器配置、systemd 单元与
      `/etc/default/pg_exporter`，使用 APT 或 YUM 升级。
    steps:
      - title: APT · Debian / Ubuntu
        title_zh: APT · Debian / Ubuntu
        lang: bash
        code: |
          sudo apt update
          sudo apt install -y curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://repo.pigsty.io/key | gpg --dearmor | sudo tee /etc/apt/keyrings/pigsty.gpg >/dev/null
          sudo chmod 0644 /etc/apt/keyrings/pigsty.gpg
          sudo tee /etc/apt/sources.list.d/pigsty-infra.list > /dev/null <<'EOF'
          deb [signed-by=/etc/apt/keyrings/pigsty.gpg] https://repo.pigsty.io/apt/infra generic main
          EOF

          sudo apt update
          sudo apt install -y pg-exporter

      - title: YUM · RHEL / Rocky / Alma
        title_zh: YUM · RHEL / Rocky / Alma
        lang: bash
        code: |
          curl -fsSL https://repo.pigsty.io/key | sudo tee /etc/pki/rpm-gpg/RPM-GPG-KEY-pigsty >/dev/null
          sudo tee /etc/yum.repos.d/pigsty-infra.repo > /dev/null <<-'EOF'
          [pigsty-infra]
          name=Pigsty Infra for $basearch
          baseurl=https://repo.pigsty.io/yum/infra/$basearch
          enabled = 1
          gpgcheck = 1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-pigsty
          module_hotfixes=1
          EOF

          sudo yum makecache
          sudo yum install -y pg-exporter

      - title: Point it at a database and start it
        title_zh: 指向数据库并启动服务
        lang: bash
        code: |
          # PG_EXPORTER_URL='postgres://monitor@127.0.0.1:5432/postgres?sslmode=disable'
          sudoedit /etc/default/pg_exporter

          sudo systemctl enable --now pg_exporter
          curl -fsS http://127.0.0.1:9630/up

  - id: artifacts
    kind: pinned
    title: RPM / DEB
    title_zh: RPM / DEB
    icon: fa-solid fa-file-zipper
    url: https://github.com/pgsty/pg_exporter/releases/tag/${tag}
    note: >-
      Download a specific RPM or DEB version for offline installation or controlled
      upgrades. Configure and start the service as shown in the package section.
    note_zh: >-
      下载指定版本的 RPM 或 DEB，用于离线安装或固定版本升级。安装后按软件包一栏配置并启动服务。
    steps:
      - title: DEB · amd64 / arm64 / ppc64le
        title_zh: DEB · amd64 / arm64 / ppc64le
        lang: bash
        code: |
          # Choose amd64, arm64, or ppc64le for this host.
          ARCH=amd64
          curl -fLO "https://github.com/pgsty/pg_exporter/releases/download/${tag}/pg-exporter_${version}-1_$ARCH.deb"
          sudo apt install "./pg-exporter_${version}-1_$ARCH.deb"
      - title: RPM · x86_64 / aarch64 / ppc64le
        title_zh: RPM · x86_64 / aarch64 / ppc64le
        lang: bash
        code: |
          ARCH=$(uname -m)
          curl -fLO "https://github.com/pgsty/pg_exporter/releases/download/${tag}/pg-exporter-${version}-1.$ARCH.rpm"
          sudo dnf install "./pg-exporter-${version}-1.$ARCH.rpm"

  - id: archive
    kind: pinned
    title: Archive
    title_zh: 压缩包
    icon: fa-solid fa-box-open
    note: >-
      Standalone binaries for Linux, macOS, and Windows. Linux supports amd64,
      arm64, and ppc64le; macOS supports amd64 and arm64; Windows supports
      amd64. For macOS, set `OS=darwin` below. Set `ARCH=arm64` for ARM64 or
      `ARCH=amd64` for x86-64. Extract only after the checksum command reports `OK`.
    note_zh: >-
      适合独立运行。Linux 提供 amd64、arm64 和 ppc64le，macOS 提供 amd64 和 arm64，
      Windows 提供 amd64。下方命令用于 Linux 或 macOS；macOS 请设置 `OS=darwin`，
      ARM64 设置 `ARCH=arm64`，x86-64 设置 `ARCH=amd64`。校验命令输出 `OK` 后再解压。
    steps:
      - title: Extract and install
        title_zh: 解压并安装
        lang: bash
        code: |
          (
            set -e
            OS=linux ARCH=amd64
            ARCHIVE="pg_exporter-${version}.$OS-$ARCH.tar.gz"

            curl -fLO "https://github.com/pgsty/pg_exporter/releases/download/${tag}/$ARCHIVE"
            curl -fLO "https://github.com/pgsty/pg_exporter/releases/download/${tag}/checksums.txt"
            if command -v sha256sum >/dev/null 2>&1; then
              grep "  $ARCHIVE$" checksums.txt | sha256sum -c -
            else
              grep "  $ARCHIVE$" checksums.txt | shasum -a 256 -c -
            fi
            mkdir -p stage && tar -xzf "$ARCHIVE" -C stage
            sudo install -m 0755 stage/pg_exporter /usr/local/bin/pg_exporter
            sudo install -m 0644 stage/pg_exporter.yml /etc/pg_exporter.yml

            pg_exporter --version
          )

  - id: container
    kind: pinned
    title: Container
    title_zh: 容器
    icon: fa-brands fa-docker
    url: https://hub.docker.com/r/pgsty/pg_exporter
    note: >-
      A multi-architecture amd64/arm64 image. It is a scratch image: it carries
      the static binary, the merged config, the license, and the system CA bundle,
      but no shell. Mount a private CA and set `sslrootcert` for private PKI.
      Replace `postgres` in the example URL with a hostname reachable from
      the container, and set the monitoring credentials.
    note_zh: >-
      多架构 amd64/arm64 镜像。它基于 scratch 构建，包含静态二进制、合并配置、许可证与系统 CA 证书，
      没有 shell；使用私有 CA 时仍需挂载证书并设置 `sslrootcert`。
      将示例 URL 中的 `postgres` 替换为容器可达的数据库主机名，并设置监控凭据。
    steps:
      - title: Run a pinned image
        title_zh: 运行固定版本镜像
        lang: bash
        code: |
          docker run -d \
            --name pg_exporter \
            --restart unless-stopped \
            -p 127.0.0.1:9630:9630 \
            -e PG_EXPORTER_URL='postgres://monitor:S3cret@postgres:5432/postgres' \
            pgsty/pg_exporter:${version}

          curl -fsS http://127.0.0.1:9630/up
      - title: Mount a secret and a custom collector file
        title_zh: 挂载密钥与自定义采集器文件
        lang: bash
        code: |
          docker run -d \
            --name pg_exporter \
            --restart unless-stopped \
            -p 127.0.0.1:9630:9630 \
            -e PG_EXPORTER_URL_FILE=/run/secrets/pgurl \
            -v ./pgurl:/run/secrets/pgurl:ro \
            -v ./pg_exporter.yml:/etc/pg_exporter.yml:ro \
            pgsty/pg_exporter:${version}

  - id: pigsty
    kind: rolling
    title: Pigsty
    title_zh: Pigsty
    icon: fa-solid fa-diagram-project
    url: https://pigsty.io/docs/setup/install/
    note: >-
      Pigsty deploys PG Exporter with metrics storage, alert rules, and Grafana
      dashboards. Download Pigsty, then follow its installation guide to
      configure your inventory and deploy the stack.
    note_zh: >-
      Pigsty 将 PG Exporter 与指标存储、告警规则和 Grafana 仪表盘一起部署。
      下载 Pigsty 后，按其安装指南配置清单并部署监控栈。
    steps:
      - title: Obtain Pigsty
        title_zh: 获取 Pigsty
        lang: bash
        code: |
          curl -fsSL https://repo.pigsty.io/get | bash
          cd ~/pigsty

  - id: source
    kind: pinned
    title: Source
    title_zh: 源码
    icon: fa-solid fa-code-branch
    url: https://github.com/pgsty/pg_exporter
    note: >-
      Build from a tag for development or custom compiler options. Follow the
      deployment guide to configure a service account and systemd unit.
    note_zh: >-
      适用于开发与自定义编译参数。按标签构建后，参考部署指南配置服务账号与 systemd 单元。
    steps:
      - title: Build the exact release tag
        title_zh: 构建指定发布标签
        lang: bash
        code: |
          git clone https://github.com/pgsty/pg_exporter.git
          cd pg_exporter
          git checkout "${tag}"
          make build

          ./pg_exporter --version
          PG_EXPORTER_URL='postgres://monitor@127.0.0.1:5432/postgres' ./pg_exporter --dry-run

  - id: assets
    kind: pinned
    title: All artifacts
    title_zh: 全部产物
    icon: fa-solid fa-fingerprint
    url: https://github.com/pgsty/pg_exporter/releases/tag/${tag}
    note: >-
      Release archives and packages with their SHA-256 digests. On macOS
      compare `shasum -a 256 <file>` against the entry for that file.
    note_zh: >-
      发布压缩包、软件包及其 SHA-256 摘要。在 macOS 上使用 `shasum -a 256 <文件>`
      与对应条目比对。
    checksums: |
      dd81e485377fd9bfead1b3e8000a145eb89d1c914becffaa3588cafc67731ed9  pg-exporter-1.6.0-1.aarch64.rpm
      413f64b25feb6202bf7cf70f10d0a73527c42767a2cc2bef37beef6d33ab48ae  pg-exporter-1.6.0-1.ppc64le.rpm
