hero:
  eyebrow: 快速上手
  title: 采集第一组 PostgreSQL 指标
  desc: 安装 PG Exporter，创建监控用户并连接 PostgreSQL，然后把指标端点加入 Prometheus。
  note: 准备一台 Linux amd64 主机及本机 PostgreSQL 10 或更新版本，并确认拥有 sudo 和数据库管理员权限。
  note_icon: fa-solid fa-circle-check
  align: center
  title_size: 3.2rem
  actions:
  - label: 其他安装方式
    url: download/
    icon: fa-solid fa-download
    style: primary
install:
  eyebrow: 第 01 步
  title: 安装
  desc: 下载并安装程序与采集器配置。
  body: |
    ```bash {copy="all"}
    VERSION=1.4.1
    ARCHIVE="pg_exporter-${VERSION}.linux-amd64.tar.gz"
    curl -fLO "https://github.com/pgsty/pg_exporter/releases/download/v${VERSION}/$ARCHIVE" &&
    curl -fLO "https://github.com/pgsty/pg_exporter/releases/download/v${VERSION}/checksums.txt" &&
    grep "  $ARCHIVE$" checksums.txt | sha256sum -c - &&
    mkdir -p "pg_exporter-${VERSION}" &&
    tar -xzf "$ARCHIVE" -C "pg_exporter-${VERSION}" &&
    sudo install -m 0755 "pg_exporter-${VERSION}/pg_exporter" /usr/local/bin/pg_exporter &&
    sudo install -m 0644 "pg_exporter-${VERSION}/pg_exporter.yml" /etc/pg_exporter.yml &&
    pg_exporter --version
    ```

    校验结果应为 `OK`，安装后的版本应为 `v1.4.1`。

    其他平台与软件包安装方式见[下载页](/zh/download/)。
monitoring-user:
  eyebrow: 第 02 步
  title: 创建监控用户
  desc: 以数据库管理员身份连接 PostgreSQL：
  body: |
    ```bash
    sudo -u postgres psql -d postgres
    ```

    将 `change-me` 替换为实际密码，然后创建监控角色：

    ```sql
    CREATE USER monitor WITH PASSWORD 'change-me';
    GRANT pg_monitor TO monitor;
    ```

    输入 `\q` 返回 Shell。下一步连接 URL 使用相同的密码。
run:
  eyebrow: 第 03 步
  title: 启动并验证
  desc: 在前台启动导出器，HTTP 端口仅监听本机。
  body: |
    URL 中的密码若包含保留字符，需要进行百分号编码，例如将 `#` 写为 `%23`。

    ```bash {copy="all"}
    export PG_EXPORTER_URL='postgres://monitor:change-me@127.0.0.1:5432/postgres?sslmode=disable'
    pg_exporter --config=/etc/pg_exporter.yml --web.listen-address=127.0.0.1:9630
    ```

    在另一个终端执行：

    ```bash
    curl -fsS http://127.0.0.1:9630/metrics | grep -E '^pg_(up|version|in_recovery) '
    ```

    远程数据库、TLS 和密码文件的配置见[生产部署](/zh/deploy/)。
output:
  eyebrow: 输出示例
  aria_label: PostgreSQL 可用性、版本与恢复状态指标
  desc: '`pg_up 1` 表示主数据库抓取没有致命错误。下面是 PostgreSQL 17 主库的输出示例。'
  lang: prometheus
  code: |
    pg_up 1
    pg_version 170000
    pg_in_recovery 0
prometheus:
  eyebrow: 第 04 步
  title: 加入 Prometheus 抓取目标
  desc: 在 prometheus.yml 中添加以下抓取目标。本例中 Prometheus 也运行在同一台主机上。
  body: |
    ```yaml {title="prometheus.yml" copy="all"}
    scrape_configs:
      - job_name: 'postgresql'
        scrape_interval: 15s
        static_configs:
          - targets: ['127.0.0.1:9630']
    ```

    重载 Prometheus，在 Targets 页面确认目标状态为 UP。如果 Prometheus 位于另一台主机，请按[生产部署](/zh/deploy/)配置可达的监听地址与目标地址。

    使用 [Pigsty 仪表盘](https://pigsty.cc/docs/pgsql/monitor/)查看指标，或访问[在线演示](https://demo.pigsty.cc)。
troubleshoot:
  eyebrow: 故障排查
  title: 检查采集结果
  desc: 用日志定位连接错误，用 `/explain` 查看已选查询，用 `/stat` 检查查询统计。
  style: accordion
  link_label: 故障排查指南
  items:
  - question: 为什么 pg_up 为 0？
    answer: 查看导出器日志，检查主机、端口、数据库、凭据和 pg_hba.conf。致命采集器错误也会使 pg_up 为 0。
    url: troubleshooting/
  - question: 为什么有些指标缺失？
    answer: 通过 /explain 查看主数据库已选中的采集器，对照目标检查版本限制、标签和 SQL。通过 /stat 查看报错次数与指标数量，具体错误见导出器日志。
    url: api/#get-explain
