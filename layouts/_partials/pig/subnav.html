{{- /* 移动端顶条（fumadocs v16 #nd-subnav 同构）：仅 <md 显示。
       品牌 + 弹性占位 + 搜索钮 + 抽屉钮（右侧抽屉）。sticky top-0、56px、毛玻璃。 */ -}}
<header class="pig-subnav d-md-none d-print-none">
  <a class="pig-subnav__brand" href="{{ .Site.Home.RelPermalink }}" aria-label="PIG home">
    <img src="{{ "img/pig.svg" | relURL }}" alt="" width="20" height="20">
    <span class="pig-wordmark">PIG</span>
  </a>
  <span class="pig-subnav__spacer"></span>
  <button type="button" class="pig-iconbtn pig-subnav__btn" data-pig-search-open
    aria-label="{{ T "ui_search" }}">{{ partialCached "pig/icon.html" "search" "search" }}</button>
  <button type="button" class="pig-iconbtn pig-subnav__btn" data-pig-drawer-open
    title="{{ T "pig_drawer_open" }}" aria-label="{{ T "pig_drawer_open" }}">
    {{- partialCached "pig/icon.html" "panel-left" "panel-left" -}}
  </button>
</header>
