{{- /* 侧栏收起时左上角的浮动控件：展开按钮 + 搜索按钮。
       默认 display:none，仅 html[data-pig-sidebar=collapsed] 且 ≥md 时由 CSS 显示。 */ -}}
<div class="pig-float d-print-none">
  <button type="button" class="pig-iconbtn" data-pig-sidebar-toggle
    title="{{ T "pig_sidebar_expand" }}" aria-label="{{ T "pig_sidebar_expand" }}">
    {{- partialCached "pig/icon.html" "panel-left" "panel-left" -}}
  </button>
  <button type="button" class="pig-iconbtn" data-pig-search-open
    aria-label="{{ T "ui_search" }}">
    {{- partialCached "pig/icon.html" "search" "search" -}}
  </button>
</div>
