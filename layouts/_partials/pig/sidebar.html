{{- /* Fumadocs 风格侧栏面板（v16 完全体，无顶栏）：
       固定头部（品牌行 + 搜索行 + 根下拉）/ 可滚动区（链接项 + 导航树）/ 底部组合件。
       面板绝对定位于 .pig-sidebar 列内，收起/抽屉状态见 pig/_layout.scss。 */ -}}
<div class="pig-sidebar__panel">
  <div class="pig-sidebar__header">
    <div class="pig-sidebar__brand-row">
      <a class="pig-sidebar__brand" href="{{ .Site.Home.RelPermalink }}" aria-label="PG Exporter home">
        <img src="{{ "img/pg-exporter.png" | relURL }}" alt="" width="24" height="24">
        <span class="pig-wordmark">PG Exporter</span>
      </a>
      <button type="button" class="pig-iconbtn pig-sidebar__collapse" data-pig-sidebar-toggle
        title="{{ T "pig_sidebar_collapse" }}" aria-label="{{ T "pig_sidebar_collapse" }}">
        {{- partialCached "pig/icon.html" "panel-left" "panel-left" -}}
      </button>
    </div>
    <div class="pig-sidebar__header-row">
      <button type="button" class="pig-search-btn" data-pig-search-open>
        {{ partialCached "pig/icon.html" "search" "search" }}
        <span class="pig-search-btn__label">{{ T "ui_search" }}</span>
        <span class="pig-search-btn__keys" aria-hidden="true"><kbd data-pig-meta-key>⌘</kbd><kbd>K</kbd></span>
      </button>
      <button type="button" class="pig-iconbtn pig-sidebar__close" data-pig-drawer-close
        aria-label="{{ T "pig_drawer_close" }}">{{ partialCached "pig/icon.html" "x" "x" }}</button>
    </div>
    {{ partial "pig/root-menu.html" . }}
  </div>
  <div class="pig-sidebar__viewport" data-pig-sidebar-scroll>
    {{ partial "sidebar.html" . }}
  </div>
  <div class="pig-sidebar__resizer" data-pig-resizer aria-hidden="true"></div>
</div>
